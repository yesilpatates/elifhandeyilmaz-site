name: Finalize editorial issue 57

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-editorial-issue57.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PDF and publish
        shell: bash
        run: |
          set -euo pipefail
          TARGET="elifhandeyilmaz-tam-site-paketi/assets/editorial-pdfs/yacht-news-turkiye-57-2026-ocak-subat.pdf"
          mkdir -p "$(dirname "$TARGET")"
          cat .pdf-upload/issue57/part-*.b64 | base64 -d > "$TARGET"
          test "$(head -c 4 "$TARGET")" = "%PDF"
          test "$(stat -c %s "$TARGET")" = "17800904"
          rm -rf .pdf-upload/issue57
          rm -f .github/workflows/finalize-editorial-issue57.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Yacht News Türkiye 57. sayıyı editoryal galeriye ekle"
          git push
