<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marka & Kurumsal Kimlik Projeleri | Elif Hande Yılmaz</title>
  <meta name="description" content="Elif Hande Yılmaz tarafından hazırlanan marka ve kurumsal kimlik projeleri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rochester&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../../assets/project-pages.css">
</head>
<body class="project-page">
  <header class="project-page-header">
    <nav class="project-page-nav" aria-label="Proje sayfası menüsü">
      <a class="project-page-brand" href="../../index.html">Elif Hande Yılmaz</a>
      <a class="project-page-back" href="../../index.html#projeler">← Tüm kategoriler</a>
    </nav>
  </header>

  <main class="project-page-main">
    <header class="project-page-intro">
      <span class="eyebrow">Proje kategorisi</span>
      <h1>Marka & Kurumsal Kimlik</h1>
      <p>Logo, görsel kimlik ve kurumsal uygulamaları tek bir marka sistemi içinde bir araya getiren seçili çalışmalar.</p>
    </header>

    <section class="brand-project-grid" aria-label="Marka ve kurumsal kimlik projeleri">
      <article class="brand-project-card">
        <a href="sagligim-burada/" aria-label="Sağlığım Burada marka sunumunu incele">
          <div class="brand-project-cover">
            <img
              class="js-base64-image"
              data-src="../../images/projects/marka-kurumsal-kimlik/sagligim-burada-sunum.webp.b64"
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              alt="Sağlığım Burada marka kimliği sunumu"
              width="320"
              height="480"
            >
          </div>
          <div class="brand-project-body">
            <div>
              <h2>Sağlığım Burada</h2>
              <p>Marka kimliği ve kurumsal uygulamalar</p>
            </div>
            <span class="brand-project-arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </article>
    </section>
  </main>

  <script>
    (() => {
      document.querySelectorAll(".js-base64-image").forEach(async (image) => {
        try {
          const response = await fetch(image.dataset.src, { cache: "force-cache" });
          if (!response.ok) throw new Error("Görsel yüklenemedi");
          const base64 = (await response.text()).trim();
          image.src = `data:image/webp;base64,${base64}`;
        } catch (error) {
          image.alt = `${image.alt} (yüklenemedi)`;
        }
      });
    })();
  </script>
</body>
</html>
