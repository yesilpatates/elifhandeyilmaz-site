<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sağlığım Burada | Marka Kimliği Projesi</title>
  <meta name="description" content="Sağlığım Burada marka kimliği ve kurumsal uygulama sunumu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rochester&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/style.css">
  <link rel="stylesheet" href="../../../assets/project-pages.css">
</head>
<body class="project-page">
  <header class="project-page-header">
    <nav class="project-page-nav" aria-label="Proje sayfası menüsü">
      <a class="project-page-brand" href="../../../index.html">Elif Hande Yılmaz</a>
      <a class="project-page-back" href="../">← Marka projeleri</a>
    </nav>
  </header>

  <main class="case-study-main">
    <header class="case-study-heading">
      <span class="eyebrow">Marka & Kurumsal Kimlik</span>
      <h1>Sağlığım Burada</h1>
      <div class="case-study-meta" aria-label="Proje bilgileri">
        <span>Logo Tasarımı</span>
        <span>Görsel Kimlik</span>
        <span>Kurumsal Uygulamalar</span>
      </div>
    </header>

    <figure class="case-study-presentation">
      <img
        class="js-base64-image"
        data-src="../../../images/projects/marka-kurumsal-kimlik/sagligim-burada-sunum.webp.b64"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        alt="Sağlığım Burada marka kimliği; logo, açık hava uygulamaları, promosyon ürünleri ve kurumsal materyaller"
        width="320"
        height="480"
      >
    </figure>

    <nav class="case-study-footer" aria-label="Proje gezinme bağlantıları">
      <a href="../">← Marka projelerine dön</a>
      <a href="../../../index.html#iletisim">Benzer bir proje için iletişime geç →</a>
    </nav>
  </main>

  <script>
    (() => {
      document.querySelectorAll(".js-base64-image").forEach(async (image) => {
        try {
          const response = await fetch(image.dataset.src, { cache: "force-cache" });
          if (!response.ok) throw new Error("Görsel yüklenemedi");
          const base64 = (await response.text()).trim();
          image.src = `data:image/webp;base64,${base64}`;
        } catch (error) {
          image.alt = `${image.alt} (yüklenemedi)`;
        }
      });
    })();
  </script>
</body>
</html>
